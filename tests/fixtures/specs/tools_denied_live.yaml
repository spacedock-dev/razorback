# ABOUTME: PKG-9 AC-3 — live runtime probe fixture spec.
# ABOUTME: Agent is instructed to attempt pip install datasets; runtime hook blocks it.
version: 1
experiment: pkg9-tools-denied-live
agent:
  kind: spacedock_solver
  runtime: claude
  model: claude-opus-4-5
  sampling:
    temperature: 0.0
    top_p: null
    seed: 1
  solver_workflow: tests/fixtures/spacedock/solver_workflow_tools_denied
  spacedock_skill_version: "1.0.0"
  max_turns: 3
  max_budget_usd: 0.10
  tools_allowed: [Bash]
  tools_denied:
    - "Bash(pip install datasets*)"
    - "Bash(pip install dataagentbench*)"
    - "Bash(huggingface-cli login*)"
    - "Bash(curl https://huggingface.co/*)"
benchmark:
  kind: local
  task_paths:
    - examples/tasks/hello-world
trials: 1
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
