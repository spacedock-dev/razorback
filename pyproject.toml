[project]
name = "razorback"
version = "0.1.0"
description = "A benchmark runner for agentic research workflows, built on harbor."
readme = "README.md"
authors = [
    { name = "CL Kao", email = "clkao@datarecce.io" }
]
requires-python = ">=3.12"
dependencies = [
    "harbor==0.6.6",
    "duckdb>=1.3",
    "typer>=0.16.0",
    "pydantic>=2.11.7",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0",
    "anthropic>=0.42",
    "scipy>=1.14",
    "numpy>=2.1",
]

[project.scripts]
rk = "razorback.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "razorback-plugin-dab",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: live integration tests; require docker/colima and provider auth",
]

[tool.uv.workspace]
members = ["packages/razorback-plugin-dab"]

[tool.uv.sources]
razorback-plugin-dab = { workspace = true }
