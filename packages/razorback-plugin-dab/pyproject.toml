[project]
name = "razorback-plugin-dab"
version = "0.1.0"
description = "DAB harbor task generator (sibling plugin to razorback)."
readme = "README.md"
authors = [
    { name = "CL Kao", email = "clkao@datarecce.io" }
]
requires-python = ">=3.12"
dependencies = [
    "harbor==0.6.6",
    "typer>=0.16.0",
    "pydantic>=2.11.7",
    "pyyaml>=6.0.2",
]

[project.scripts]
razorback-plugin-dab = "razorback_plugin_dab.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "long: integration tests that require docker / heavy data; opt-in via -m long",
]
