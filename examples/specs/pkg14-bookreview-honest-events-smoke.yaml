# ABOUTME: PKG-14 AC-6 — bind-mount default produces honest events.jsonl with psql/dab-postgres.
# ABOUTME: One bookreview trial under direct-minimal — confirms the bind-mount path doesn't break the live-DB execution chain.
version: 1
experiment: pkg14-bookreview-honest-events-smoke
agent:
  kind: claude-cli
  model: claude-opus-4-7
  sampling:
    temperature: 0.0
  tools_allowed:
  - Bash
  - Read
  - Write
  - Edit
  - Glob
  - Grep
benchmark:
  kind: harbor
  dataset: dab@1.0
  plugin: dab
  plugin_args:
    workspace_variant: direct-minimal
    hints: false
    data_root: ${DATAAGENTBENCH_DATA_ROOT:-~/dataagentbench/data}
  tasks:
  - bookreview
trials: 1
experiment_meta:
  max_budget_usd: 2.0
  estimated_cost_usd: 0.5
observers:
- kind: jsonl
  path: events.jsonl
- kind: stdout
