# PKG-40 — ade-bench Harbor-shaped probe spec.
#
# DO NOT RUN from the implementation stage. Validation dispatches this AFTER
# the captain frees disk (≥ 10 GiB free) and exports CLAUDE_CODE_OAUTH_TOKEN.
# The implementation stage emits the spec only.
#
# This spec intentionally uses Harbor-shaped task directories. The retired
# Retired local upstream adapter specs are not accepted for new score specs.
version: 1
experiment: probe-ade-bench-airbnb001-claude-harbor-local
agent:
  kind: claude-cli
  model: claude-opus-4-5
  sampling:
    temperature: 0.0
  tools_allowed:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
benchmark:
  kind: harbor-local
  tasks_root: ./tests/fixtures/ade_bench/tasks
  tasks:
    - adebench-fixture-001
trials: 1
concurrency:
  trials: 1
experiment_meta:
  max_budget_usd: 5.0
  estimated_cost_usd: 2.0
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
