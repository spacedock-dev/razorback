# ABOUTME: Phase 0 deterministic smoke micro-spec — walking-skeleton anchor for Phases 1-3.
# ABOUTME: One task, N=1, temp=0.0, fixed seed. Re-runs MUST produce identical outputs.
version: 1
experiment: _deterministic-smoke
agent:
  kind: claude-cli
  model: claude-opus-4-5
  sampling:
    temperature: 0.0
    seed: 1
  tools_allowed: [Bash, Read, Write, Edit, Glob, Grep]
benchmark:
  kind: dab
  data_root: /Users/clkao/git/dataagentbench/data
  datasets:
    - bookreview
trials: 1
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout

# Expected outcome (recorded 2026-05-20 against razorback v1 at commit 2a2be8c):
#   pass: false (3/3 trials fail; stratified_pass_at_1 = 0.0)
#   final answer substring: n/a — agent.cost_usd is null and no answers.json
#     is produced on the host side; every trial fails at the verifier step
#     with harbor.verifier.verifier.RewardFileNotFoundError before any answer
#     is graded. Trial result.json's step_results[0].exception_info captures
#     the typed exception and traceback.
#   notes: This spec declares `datasets: [bookreview]` and the v1 DAB adapter
#     expands that to all 3 query subdirs under query_bookreview/, so the run
#     executes 3 trials (one per task at N=1), not 1. AC-0.1(b)'s "one task"
#     intent is not realized by the current spec schema — there is no
#     per-query selector. Determinism still holds: any deviation from the
#     3/3 RewardFileNotFoundError outcome on this commit catches a regression.
#     See docs/superpowers/plans/2026-05-19-reconciliation-baseline.md for
#     the full pre-correction reference and the Phase 0 side findings.
#
# Determinism caveats (per spec §9.5): Anthropic models do not honor seed;
# same-prompt+same-seed+same-model may still drift. The `seed: 1` field is
# present so the runtime records it; reproducibility checks ride on
# temperature=0.0 + trials=1 + dataset-frozen prompt content.
