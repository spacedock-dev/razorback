# ABOUTME: PKG-14 AC-8 + AC-6 — two-trial cross-variant smoke on bookreview.
# ABOUTME: Trial 1 = direct-minimal (seeds the postgres volume). Trial 2 = spacedock
# ABOUTME: (must attach the seeded volume and SKIP init.d).
version: 1
experiment: pkg14-bookreview-two-trial-cross-variant-smoke
agent:
  kind: claude-cli
  model: claude-opus-4-7
  sampling:
    temperature: 0.0
  tools_allowed:
  - Bash
  - Read
  - Write
  - Edit
  - Glob
  - Grep
benchmark:
  kind: harbor
  dataset: dab@1.0
  plugin: dab
  plugin_args:
    workspace_variant: direct-minimal
    hints: false
    data_root: ${DATAAGENTBENCH_DATA_ROOT:-~/dataagentbench/data}
  tasks:
  - bookreview
trials: 1
experiment_meta:
  max_budget_usd: 3.0
  estimated_cost_usd: 1.0
observers:
- kind: jsonl
  path: events.jsonl
- kind: stdout
