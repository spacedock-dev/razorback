version: 1
experiment: t14-bookreview-claude-harbor-dab-n3
agent:
  kind: claude-cli
  model: claude-opus-4-5
  sampling:
    temperature: 0.0
  tools_allowed:
  - Bash
  - Read
  - Write
  - Edit
  - Glob
  - Grep
benchmark:
  kind: harbor
  dataset: dab@1.0
  plugin: dab
  plugin_args:
    workspace_variant: direct-minimal
    hints: false
    data_root: ${DATAAGENTBENCH_DATA_ROOT:-~/dataagentbench/data}
  tasks:
  - bookreview
trials: 3
observers:
- kind: jsonl
  path: events.jsonl
- kind: stdout
