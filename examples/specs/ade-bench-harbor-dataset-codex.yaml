# ABOUTME: Canonical ade-bench score spec — Harbor published dataset ref (paper-grade digest pin).
# ABOUTME: `@sha256:` digest is the load-bearing pin; view_manifest.json's dataset_content_hash + task_content_hash codify the same hash for the freeze provenance.
version: 1
experiment: ade-bench-harbor-dataset-codex
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: 1
  solver_workflow: ./examples/solver_workflows/codex-ade-dbt-minimal
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  reasoning_effort: xhigh
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: ade-bench
  dataset: dbt-labs/ade-bench@sha256:2c1f9e6966d01b0a5de2235d1a0b64089c7eead42c85c3b7b61d0929405c2bd5
  tasks:
    - airbnb001
  batch_mode: per-task
trials: 1
concurrency:
  trials: 1
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
