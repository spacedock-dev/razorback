# ABOUTME: Canonical ade-bench score spec — Harbor published dataset ref (no local task root).
# ABOUTME: Reproducibility is pinned by view_manifest.json's dataset_content_hash + task_content_hash, not the human-readable `@latest`.
version: 1
experiment: ade-bench-harbor-dataset-codex
agent:
  kind: spacedock_solver_v2
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: 1
  solver_workflow: ./examples/solver_workflows/codex-benchmark-solver
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: ade-bench
  dataset: dbt-labs/ade-bench@latest
  tasks:
    - airbnb001
  docker_image_override: shared-dbt-duckdb:latest
  batch_mode: per-task
trials: 1
concurrency:
  trials: 1
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
