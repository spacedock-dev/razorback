# ABOUTME: Dev-only DAB spec — uses legacy kind: dab (via in_tree_dab alias). Canonical path is
# ABOUTME: kind: harbor_dab + dataset: dab@1.0 (see goal1-paper-matrix specs).
version: 1
experiment: phase2-bookreview-claude-in-tree-dab
agent:
  kind: claude-cli
  model: claude-opus-4-5
  sampling:
    temperature: 0.0
  tools_allowed: [Bash, Read, Write, Edit, Glob, Grep]
benchmark:
  kind: harbor_dab
  data_root: "${DATAAGENTBENCH_DATA_ROOT:-~/dataagentbench/data}"
  datasets:
    - bookreview
trials: 1
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
