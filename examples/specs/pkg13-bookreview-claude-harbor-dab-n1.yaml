# ABOUTME: PKG-13 T10 — single-trial smoke against fixed harbor-dab live-DB stack.
# ABOUTME: Validates compose-under-environment + reachability gate + sidecar end to end.
version: 1
experiment: pkg13-bookreview-claude-harbor-dab-n1-smoke
agent:
  kind: claude-cli
  model: claude-opus-4-5
  sampling:
    temperature: 0.0
  tools_allowed: [Bash, Read, Write, Edit, Glob, Grep]
benchmark:
  kind: harbor_dab
  data_root: "${DATAAGENTBENCH_DATA_ROOT:-~/dataagentbench/data}"
  datasets:
    - bookreview
  workspace_variant: direct-minimal
  hints: false
trials: 1
experiment_meta:
  max_budget_usd: 5.0
  estimated_cost_usd: 1.5
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
