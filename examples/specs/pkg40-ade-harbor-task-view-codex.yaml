# ABOUTME: PKG-40 ADE-Bench Harbor-shaped task-view Codex smoke spec.
# ABOUTME: Uses the in-repo Harbor task fixture; live ADE data remains out of scope.
version: 1
experiment: pkg40-ade-harbor-task-view-codex
agent:
  kind: spacedock_solver_v2
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: 1
  solver_workflow: ./examples/solver_workflows/codex-benchmark-solver
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: ade-bench
  tasks_root: ./tests/fixtures/ade_bench/tasks
  tasks:
    - adebench-fixture-001
  docker_image_override: shared-dbt-duckdb:latest
  batch_mode: per-task
trials: 1
concurrency:
  trials: 1
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
