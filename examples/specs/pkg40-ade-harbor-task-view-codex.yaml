# ABOUTME: FIXTURE/DEV PKG-40 ADE-Bench task-view Codex smoke — uses in-repo Harbor task fixture.
# ABOUTME: Canonical score path is examples/specs/ade-bench-harbor-dataset-codex.yaml (Harbor dataset ref).
version: 1
experiment: pkg40-ade-harbor-task-view-codex
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: 1
  solver_workflow: ./examples/solver_workflows/codex-benchmark-solver
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: ade-bench
  tasks_root: ./tests/fixtures/ade_bench/tasks
  tasks:
    - adebench-fixture-001
  docker_image_override: python:3.12
  batch_mode: per-task
trials: 1
concurrency:
  trials: 1
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
