# ABOUTME: PKG-27 DAB Codex smoke spec; override data_root before live execution.
# ABOUTME: Freezes without local DAB data to prove solver workflow content hashing.
version: 1
experiment: codex-dab-bookreview-smoke
agent:
  kind: spacedock_solver_v2
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: 1
  solver_workflow: ./examples/solver_workflows/codex-benchmark-solver
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor_dab
  data_root: /path/to/dataagentbench/data
  datasets:
    - bookreview
  workspace_variant: direct-structured
  hints: false
trials: 1
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
