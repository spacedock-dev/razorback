# ABOUTME: Direct minimal DAB Codex smoke spec; override data_root before live execution.
# ABOUTME: Uses agent.kind=codex without solver workflow or sealed hash semantics.
version: 1
experiment: codex-dab-bookreview-smoke
agent:
  kind: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
benchmark:
  kind: harbor
  dataset: dab@1.0
  plugin: dab
  plugin_args:
    workspace_variant: direct-minimal
    hints: false
    data_root: /path/to/dataagentbench/data
  tasks:
  - bookreview
trials: 1
observers:
- kind: jsonl
  path: events.jsonl
- kind: stdout
